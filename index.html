
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            display: block;
            text-decoration: none;
            color: #f1f5f9;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 22px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.25s ease;
        }

        .card:hover {
            background: #263750;
            border-color: #38bdf8;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px #38bdf822;
        }

        .description {
            display: block;
            font-size: 0.9rem;
            font-weight: normal;
            color: #94a3b8;
            margin-top: 8px;
        }

        footer {
            margin-top: 40px;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>My Projects</h1>
        <p class="subtitle">Choose something to explore.</p>

        <nav class="links">
            <a class="card" href="game.html">
                🎮 Game
                <span class="description">Play my game</span>
            </a>

            <a class="card" href="doom.html">
                💀 DOOM
                <span class="description">Enter the battlefield</span>
            </a>

            <a class="card" href="Function.html">
                📐 Function
                <span class="description">Explore functions</span>
            </a>
        </nav>

        <footer>Made by me · All rights reserved</footer>
    </main>
</body>
</html>
